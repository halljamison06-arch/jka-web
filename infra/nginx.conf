# nginx baked into the jka:ovh image. Plain HTTP:80; the shared edge Caddy (+ Cloudflare) do TLS.
# server_name is a catch-all — the edge already routed here by Host.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation on EVERY response (SharedArrayBuffer / wasm) — set here so it survives
    # regardless of the edge config. The edge deliberately does NOT duplicate these (a duplicate
    # COOP/COEP silently breaks crossOriginIsolated).
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    gzip on;
    gzip_types application/javascript application/wasm text/css image/svg+xml;
    # NB: nginx 1.27's mime.types already maps .wasm -> application/wasm. Do NOT add a bare
    # `types {}` block — it REPLACES the whole map and breaks text/html.

    # HTML is never cached: a stale launcher/index can point at engine bytes that no longer exist,
    # and client-side fixes must reach players immediately. Mirrors ja2-web.
    # NOTE: add_header in a location REPLACES the server-level ones, so the isolation headers are
    # repeated here — without them the engine loses SharedArrayBuffer.
    # `/` serves index.html — the single-page launcher+game (demo / your-copy tiles, boots in place).
    # Uniform chrome + no-store mirror ja2-web; the launcher/game split is not used here.
    location = / {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location ~* \.html$ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Validate mutable asset names on each visit. ETag/Last-Modified allow 304 reuse
    # while ensuring a deployment never mixes old JS with a new WASM side module.
    location ~* \.(wasm|data|js|pk3|css|svg|png)$ {
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
